name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment may touch the Pages site at a time. Queue a second push
# instead of cancelling the deployment that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 requires >=22.23.4. The runner's default v22 cache can be
          # one patch older, so pin the first supported release.
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Canonical URLs, Open Graph URLs, the sitemap and robots.txt are all
      # built from SITE_URL, and the base path comes from BASE_PATH. A project
      # site lives at <owner>.github.io/<repo>/; a user site and a custom
      # domain live at the origin root.
      - name: Resolve production origin
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"

          if [ -n "$SITE_URL_OVERRIDE" ]; then
            origin="${SITE_URL_OVERRIDE%/}"
            base="/"
          elif [ "$repo" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            origin="https://${owner}.github.io"
            base="/"
          else
            origin="https://${owner}.github.io"
            base="/${repo}"
          fi

          echo "SITE_URL=$origin" >> "$GITHUB_ENV"
          echo "BASE_PATH=$base" >> "$GITHUB_ENV"
          echo "Building for ${origin}${base}"

      # check + unit tests + build + built-output checks. This is the same
      # gate used locally, so a broken link or missing asset never deploys.
      - name: Verify and build
        run: npm run verify

      # The workflow uploads the artifact directly, so Jekyll never runs. The
      # marker is still shipped for anyone deploying from a branch instead.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
