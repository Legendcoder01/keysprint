name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment may touch the Pages site at a time. Queue a second push
# instead of cancelling the deployment that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Canonical URLs, Open Graph URLs, the sitemap and robots.txt are all
      # built from SITE_URL. A user site lives at <owner>.github.io; a custom
      # domain can override this with a repository variable named SITE_URL.
      - name: Resolve production origin
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$SITE_URL_OVERRIDE" ]; then
            origin="${SITE_URL_OVERRIDE%/}"
          else
            owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
            origin="https://${owner}.github.io"
          fi
          echo "SITE_URL=$origin" >> "$GITHUB_ENV"
          echo "Building for $origin"

      # check + unit tests + build + built-output checks. This is the same
      # gate used locally, so a broken link or missing asset never deploys.
      - name: Verify and build
        run: npm run verify

      # The workflow uploads the artifact directly, so Jekyll never runs. The
      # marker is still shipped for anyone deploying from a branch instead.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
